name: Temporary Direction Focus Surface Fix

on:
  push:
    branches: ["fix/direction-ui-contrast-aa"]

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: fix/direction-ui-contrast-aa
          fetch-depth: 0
          persist-credentials: false

      - name: Apply focus-surface contrast fix
        run: |
          python - <<'PY'
          from pathlib import Path

          ui_path = Path("src/samchat/client_executive/ui.py")
          ui = ui_path.read_text()
          ui = ui.replace(
              "--line:#e2e8f0; --soft:#f8fafc; --accent:#0f766e; --accent-soft:#ecfdf5; --link:#0369a1;",
              "--line:#e2e8f0; --soft:#f8fafc; --accent:#0f766e; --accent-soft:#ecfdf5; --link:#0369a1; --focus:#0369a1; --focus-on-dark:#7dd3fc;",
              1,
          )
          ui = ui.replace(
              "a:focus-visible,button:focus-visible,select:focus-visible,summary:focus-visible {{ outline:3px solid var(--link); outline-offset:2px; }}",
              "a:focus-visible,button:focus-visible,select:focus-visible,summary:focus-visible {{ outline:3px solid var(--focus); outline-offset:2px; }}\n        .hero button:focus-visible,.hero select:focus-visible {{ outline-color:var(--focus-on-dark); }}",
              1,
          )
          ui = ui.replace(
              "--soft:#162638; --navy:#ffffff; --link:#7dd3fc; --shadow:0 12px 30px rgba(0,0,0,.22);",
              "--soft:#162638; --navy:#ffffff; --link:#7dd3fc; --focus:#7dd3fc; --focus-on-dark:#7dd3fc; --shadow:0 12px 30px rgba(0,0,0,.22);",
              1,
          )
          ui_path.write_text(ui)

          test_path = Path("tests/unit/test_client_executive_auth.py")
          tests = test_path.read_text()
          tests = tests.replace(
              '    assert "--link:#0369a1" in html\n',
              '    assert "--link:#0369a1" in html\n    assert "--focus:#0369a1" in html\n    assert "--focus-on-dark:#7dd3fc" in html\n',
              1,
          )
          tests = tests.replace(
              '    assert "outline:3px solid var(--link)" in html\n',
              '    assert "outline:3px solid var(--focus)" in html\n    assert ".hero button:focus-visible,.hero select:focus-visible" in html\n    assert "outline-color:var(--focus-on-dark)" in html\n',
              1,
          )
          tests = tests.replace(
              '    assert contrast("#0369a1", "#ffffff") >= 3\n    assert contrast("#0369a1", "#f5f7fa") >= 3\n    assert contrast("#7dd3fc", "#07111c") >= 3\n    assert contrast("#7dd3fc", "#101c2a") >= 3\n',
              '    assert contrast("#0369a1", "#ffffff") >= 4.5\n    assert contrast("#0369a1", "#f5f7fa") >= 4.5\n    assert contrast("#7dd3fc", "#101c2a") >= 4.5\n    assert contrast("#7dd3fc", "#183153") >= 3\n    assert contrast("#7dd3fc", "#0f172a") >= 3\n',
              1,
          )
          test_path.write_text(tests)
          PY

      - name: Compile edited Python
        run: |
          python -m py_compile src/samchat/client_executive/ui.py tests/unit/test_client_executive_auth.py

      - name: Commit and push remediation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/samchat/client_executive/ui.py tests/unit/test_client_executive_auth.py
          git commit -m "fix(direction): separate focus contrast by surface"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:fix/direction-ui-contrast-aa

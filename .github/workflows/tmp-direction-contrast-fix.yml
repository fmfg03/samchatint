name: Temporary Direction Contrast Pass

on:
  push:
    branches: ["fix/direction-ui-contrast-aa"]

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/direction-ui-contrast-aa
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply WCAG AA contrast tokens and regression
        run: |
          python - <<'PY'
          from pathlib import Path

          ui_path = Path("src/samchat/client_executive/ui.py")
          ui = ui_path.read_text()

          replacements = [
              (
                  "--line:#e2e8f0; --soft:#f8fafc; --accent:#0f766e; --accent-soft:#ecfdf5;",
                  "--line:#e2e8f0; --soft:#f8fafc; --accent:#0f766e; --accent-soft:#ecfdf5; --link:#0369a1;",
              ),
              (
                  "a {{ color:#0369a1; text-underline-offset:3px; }}",
                  "a {{ color:var(--link); text-underline-offset:3px; }}",
              ),
              (
                  "--ink:#e5edf5; --muted:#9fb0c3; --paper:#101c2a; --canvas:#07111c; --line:#2d4257; --soft:#162638; --navy:#f8fafc; --shadow:0 12px 30px rgba(0,0,0,.22);",
                  "--ink:#f1f5f9; --muted:#b8c7d9; --paper:#101c2a; --canvas:#07111c; --line:#41566d; --soft:#162638; --navy:#ffffff; --link:#7dd3fc; --shadow:0 12px 30px rgba(0,0,0,.22);",
              ),
              (
                  "nav a,td,.attention li,.summary-meta {{ color:#d5e0ea; }}",
                  "nav a,td,.attention li,.summary-meta {{ color:var(--ink); }}",
              ),
          ]
          for old, new in replacements:
              if old in ui:
                  ui = ui.replace(old, new, 1)
              elif new not in ui:
                  raise SystemExit(f"contrast patch target not found: {old}")

          dark_anchor = "          nav a,td,.attention li,.summary-meta {{ color:var(--ink); }}\n"
          dark_overrides = (
              "          nav a,td,.attention li,.summary-meta {{ color:var(--ink); }}\n"
              "          .tournament-header h2,.section-heading h2,.kpi strong,.mini-kpis strong,.mini-kpis p,.entity-body h3,.subheading h3,details.entity>summary strong {{ color:var(--navy); }}\n"
              "          .tournament-header p,.section-note,.source-note,.section-heading p,.empty-copy,.kpi small,.kpi span,.subheading span,details.entity>summary div span,.mini-kpis span,.mini-kpis h4,.pending-details summary {{ color:var(--muted); }}\n"
              "          .eyebrow {{ color:#67e8f9; }}\n"
          )
          if dark_overrides not in ui:
              if dark_anchor not in ui:
                  raise SystemExit("dark-mode anchor not found")
              ui = ui.replace(dark_anchor, dark_overrides, 1)

          focus_rule = "        a:focus-visible,button:focus-visible,select:focus-visible,summary:focus-visible {{ outline:3px solid #38bdf8; outline-offset:2px; }}\n"
          focus_anchor = "        button {{ cursor:pointer; font-weight:800; }}\n"
          if focus_rule not in ui:
              if focus_anchor not in ui:
                  raise SystemExit("focus anchor not found")
              ui = ui.replace(focus_anchor, focus_anchor + focus_rule, 1)

          ui_path.write_text(ui)

          test_path = Path("tests/unit/test_client_executive_auth.py")
          tests = test_path.read_text()
          marker = "def test_schema_guard_creates_position_dependencies_before_legacy_portfolios():\n"
          regression = '''def test_direction_dashboard_dark_palette_meets_aa_and_uses_semantic_tokens():\n    html = _render_dashboard({"edition_year": 2026, "cards": []})\n\n    assert "--link:#0369a1" in html\n    assert "--ink:#f1f5f9" in html\n    assert "--muted:#b8c7d9" in html\n    assert "--link:#7dd3fc" in html\n    assert "a { color:var(--link)" in html\n    assert ".kpi span,.subheading span" in html\n    assert "color:var(--muted)" in html\n    assert "outline:3px solid #38bdf8" in html\n\n    def relative_luminance(value: str) -> float:\n        raw = value.lstrip("#")\n        channels = [int(raw[index : index + 2], 16) / 255 for index in (0, 2, 4)]\n\n        def linear(channel: float) -> float:\n            return (\n                channel / 12.92\n                if channel <= 0.04045\n                else ((channel + 0.055) / 1.055) ** 2.4\n            )\n\n        red, green, blue = (linear(channel) for channel in channels)\n        return 0.2126 * red + 0.7152 * green + 0.0722 * blue\n\n    def contrast(foreground: str, background: str) -> float:\n        first = relative_luminance(foreground)\n        second = relative_luminance(background)\n        lighter, darker = max(first, second), min(first, second)\n        return (lighter + 0.05) / (darker + 0.05)\n\n    assert contrast("#f1f5f9", "#07111c") >= 4.5\n    assert contrast("#b8c7d9", "#101c2a") >= 4.5\n    assert contrast("#7dd3fc", "#07111c") >= 4.5\n    assert contrast("#67e8f9", "#101c2a") >= 4.5\n\n\n'''
          if "test_direction_dashboard_dark_palette_meets_aa_and_uses_semantic_tokens" not in tests:
              if marker not in tests:
                  raise SystemExit("test insertion marker not found")
              tests = tests.replace(marker, regression + marker, 1)
          test_path.write_text(tests)
          PY

      - name: Format and compile
        run: |
          python -m pip install "black==26.5.1" "isort==9.0.1"
          python -m isort src/samchat/client_executive/ui.py tests/unit/test_client_executive_auth.py
          python -m black src/samchat/client_executive/ui.py tests/unit/test_client_executive_auth.py
          python -m isort --check-only src/samchat/client_executive/ui.py tests/unit/test_client_executive_auth.py
          python -m black --check src/samchat/client_executive/ui.py tests/unit/test_client_executive_auth.py
          python -m py_compile src/samchat/client_executive/ui.py tests/unit/test_client_executive_auth.py

      - name: Commit contrast pass
        run: |
          if git diff --quiet; then
            echo "No contrast changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/samchat/client_executive/ui.py tests/unit/test_client_executive_auth.py
          git commit -m "fix(direction): improve dark mode contrast"
          git push origin HEAD:fix/direction-ui-contrast-aa

name: Temporary Direction Summary Contract Fix

on:
  push:
    branches: ["fix/direction-dashboard-truth-ui-v2"]

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/direction-dashboard-truth-ui-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Normalize Direction budget snapshot contract
        run: |
          python - <<'PY'
          from pathlib import Path

          service_path = Path("src/samchat/client_executive/service.py")
          service = service_path.read_text()

          helper_marker = "\n\ndef _executive_card("
          helper = '''\n\ndef _budget_metric(\n    summary: dict[str, Any], comparison: dict[str, Any], key: str\n) -> Optional[float]:\n    \"\"\"Read canonical aggregates from summary with legacy comparison fallback.\"\"\"\n    value = _optional_money(summary, key)\n    return value if value is not None else _optional_money(comparison, key)\n'''
          if "def _budget_metric(" not in service:
              if helper_marker not in service:
                  raise SystemExit("_executive_card marker not found")
              service = service.replace(helper_marker, helper + helper_marker, 1)

          replacements = {
              '''        "actual": (\n            _optional_money(comparison, "actual_total", "paid_total")\n            if scope_available\n            else None\n        ),''': '''        "actual": (\n            _budget_metric(summary, comparison, "actual_total")\n            if scope_available\n            else None\n        ),''',
              '''        "committed": (\n            _optional_money(comparison, "committed_total") if scope_available else None\n        ),''': '''        "committed": (\n            _budget_metric(summary, comparison, "committed_total")\n            if scope_available\n            else None\n        ),\n        "available": (\n            _optional_money(forecast, "remaining_budget") if scope_available else None\n        ),''',
              '''        card["paid"] = (\n            _optional_money(summary, "paid_total") if scope_available else None\n        )''': '''        card["paid"] = (\n            _budget_metric(summary, comparison, "paid_total")\n            if scope_available\n            else None\n        )''',
              '''        card["requested"] = (\n            _optional_money(comparison, "requested_total") if scope_available else None\n        )''': '''        card["requested"] = (\n            _budget_metric(summary, comparison, "requested_total")\n            if scope_available\n            else None\n        )''',
              '''        card["pending_to_pay"] = (\n            _optional_money(comparison, "pending_to_pay_total")\n            if scope_available\n            else None\n        )''': '''        card["pending_to_pay"] = (\n            _budget_metric(summary, comparison, "pending_to_pay_total")\n            if scope_available\n            else None\n        )''',
          }
          for old, new in replacements.items():
              if old in service:
                  service = service.replace(old, new, 1)
              elif new not in service:
                  raise SystemExit(f"expected service block not found: {old[:60]!r}")
          service_path.write_text(service)

          ui_path = Path("src/samchat/client_executive/ui.py")
          ui = ui_path.read_text()
          old_ui = '''    available = None\n    if budget is not None:\n        used = max(float(actual or 0), float(committed or 0))\n        available = float(budget) - used\n'''
          new_ui = '''    available = card.get("available")\n    if (\n        available is None\n        and budget is not None\n        and actual is not None\n        and committed is not None\n    ):\n        available = float(budget) - max(float(actual), float(committed))\n'''
          if old_ui in ui:
              ui = ui.replace(old_ui, new_ui, 1)
          elif new_ui not in ui:
              raise SystemExit("expected UI available block not found")
          ui_path.write_text(ui)

          test_path = Path("tests/unit/test_direction_dashboard_source_reconciliation.py")
          tests = test_path.read_text()
          if "def test_budget_db_aggregate_contract_reads_summary_before_legacy_comparison():" not in tests:
              tests += '''\n\n\ndef test_budget_db_aggregate_contract_reads_summary_before_legacy_comparison():\n    card = service._executive_card(\n        {"id": "tor-1", "name": "Copa Telmex", "slug": ""},\n        {\n            "source": "budget_db",\n            "summary": {\n                "budget_total": 1000.0,\n                "requested_total": 700.0,\n                "committed_total": 650.0,\n                "paid_total": 375.0,\n                "actual_total": 420.0,\n                "pending_to_pay_total": 275.0,\n            },\n            "comparison": {\n                "requested_total": 9901.0,\n                "committed_total": 9902.0,\n                "paid_total": 9903.0,\n                "actual_total": 9904.0,\n                "pending_to_pay_total": 9905.0,\n            },\n            "forecast": {\n                "projected_close_total": 900.0,\n                "remaining_budget": 350.0,\n            },\n            "version": {"id": "version-1"},\n        },\n    )\n\n    assert card["budget"] == 1000.0\n    assert card["actual"] == 420.0\n    assert card["committed"] == 650.0\n    assert card["paid"] == 375.0\n    assert card["requested"] == 700.0\n    assert card["pending_to_pay"] == 275.0\n    assert card["available"] == 350.0\n    assert card["projected"] == 900.0\n'''
          if "def test_budget_kpis_do_not_invent_available_when_usage_is_missing():" not in tests:
              tests += '''\n\n\ndef test_budget_kpis_do_not_invent_available_when_usage_is_missing():\n    rendered = ui._budget_kpis(\n        {\n            "budget": 1000.0,\n            "actual": None,\n            "committed": None,\n            "paid": None,\n            "projected": None,\n            "budget_source_status": "available",\n        }\n    )\n\n    assert "<span>Disponible</span><strong>No disponible</strong>" in rendered\n\n\ndef test_budget_kpis_can_derive_available_only_from_explicit_usage_values():\n    rendered = ui._budget_kpis(\n        {\n            "budget": 1000.0,\n            "actual": 420.0,\n            "committed": 650.0,\n            "paid": 375.0,\n            "projected": 900.0,\n            "budget_source_status": "available",\n        }\n    )\n\n    assert "<span>Disponible</span><strong>$350.00</strong>" in rendered\n'''
          test_path.write_text(tests)
          PY

      - name: Format changed Python files
        run: |
          python -m pip install "black==26.5.1" "isort==9.0.1"
          python -m isort \
            src/samchat/client_executive/service.py \
            src/samchat/client_executive/ui.py \
            tests/unit/test_direction_dashboard_source_reconciliation.py
          python -m black \
            src/samchat/client_executive/service.py \
            src/samchat/client_executive/ui.py \
            tests/unit/test_direction_dashboard_source_reconciliation.py
          python -m isort --check-only \
            src/samchat/client_executive/service.py \
            src/samchat/client_executive/ui.py \
            tests/unit/test_direction_dashboard_source_reconciliation.py
          python -m black --check \
            src/samchat/client_executive/service.py \
            src/samchat/client_executive/ui.py \
            tests/unit/test_direction_dashboard_source_reconciliation.py

      - name: Commit remediation
        run: |
          if git diff --quiet; then
            echo "No remediation changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/samchat/client_executive/service.py \
            src/samchat/client_executive/ui.py \
            tests/unit/test_direction_dashboard_source_reconciliation.py
          git commit -m "fix(direction): align executive totals with budget summary"
          git push origin HEAD:fix/direction-dashboard-truth-ui-v2

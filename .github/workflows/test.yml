name: Test Suite

on:
  pull_request:
    branches: [master, main, develop]
  push:
    branches: [master, main, develop]
  merge_group:

concurrency:
  group: test-suite-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONPATH: src
  OPENAI_API_KEY: test-key
  ANTHROPIC_API_KEY: test-key
  REDIS_URL: redis://localhost:6379/1
  POSTGRESQL_URL: postgresql://test_user:test_password@localhost:5432/devnous_test

jobs:
  policy:
    name: Policy and repository contract
    runs-on: ${{ vars.SAMCHAT_CI_SELF_HOSTED == 'true' && 'samchat-ci' || 'ubuntu-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install gate dependencies
        run: python -m pip install PyYAML setuptools

      - name: Check workflow contract
        run: python scripts/ci/check-pr-quality-gate.py

      - name: Check runtime, registration, and accepted regressions
        run: |
          python scripts/check_runtime_packaging_consistency.py
          python scripts/ci/check-registration-operational-surface.py
          python scripts/ci/check-accepted-regressions.py

      - name: Compile production and test Python
        run: |
          python -m compileall -q \
            -x '(^|/)(\.venv|venv|node_modules|tmp|artifacts|cleanup-backups)(/|$)' \
            copa_telmex_dashboard.py src tests

      - name: Check diff hygiene
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PR_BASE_SHA" "$PR_HEAD_SHA"
          else
            git diff --check HEAD^ HEAD
          fi

  unit-tests:
    name: Unit tests (Python 3.12)
    runs-on: ${{ vars.SAMCHAT_CI_SELF_HOSTED == 'true' && 'samchat-ci' || 'ubuntu-24.04' }}
    outputs:
      coverage_b64: ${{ steps.export_coverage.outputs.coverage_b64 }}
      coverage_sha256: ${{ steps.export_coverage.outputs.coverage_sha256 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Free hosted runner disk space
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          rm -rf "$HOME/.cache/pip"
          mkdir -p "$HOME/.cache/pip"
          df -h /

      - name: Install dependencies
        env:
          PIP_NO_CACHE_DIR: "1"
        run: bash scripts/ci/install-cpu-test-dependencies.sh python -r requirements.txt -r requirements-test.txt

      - name: Verify and prepare exact CTT kit test fixtures
        run: python scripts/ci/check-ctt-test-fixtures.py --prepare "/tmp/ctt-ci-unit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --github-env "$GITHUB_ENV"

      - name: Run isolated private-plugin unit tests
        run: |
          python -m venv .venv-private-plugin
          .venv-private-plugin/bin/python -m pip install -r requirements-private-plugin-test.txt coverage
          mkdir -p reports/private-plugin
          COVERAGE_FILE=reports/private-plugin/unit.coverage .venv-private-plugin/bin/python -m coverage run \
            --source=src/samchat/private_plugin scripts/private_plugin/run_offline_tests.py

      - name: Run unit tests
        run: |
          set +e
          python -m pytest tests/unit deployment/ctt_protected_review/tests \
            --cov-config=.github/coverage-repository.ini \
            --ignore=tests/unit/private_plugin \
            --ignore=tests/unit/readonly_gateway \
            --cov=src \
            --cov=copa_telmex_dashboard \
            --cov=deployment.ctt_protected_review \
            --cov=scripts \
            --cov-report= \
            --cov-fail-under=0 \
            --timeout=60 \
            --durations=20 \
            --junitxml=reports/unit-3.12.xml
          pytest_status=$?
          set -e
          if [[ "$pytest_status" -ne 0 && "$pytest_status" -ne 1 ]]; then
            echo "Pytest did not complete normally (exit $pytest_status)."
            exit "$pytest_status"
          fi
          python scripts/ci/check-pytest-baseline.py \
            --junit reports/unit-3.12.xml \
            --baseline .github/pytest-unit-failures.txt
          if [[ "$pytest_status" -ne 0 ]]; then
            echo "Pytest exited $pytest_status; all failures matched the explicit baseline."
          fi

      - name: Set up Node.js for the readonly PostgreSQL tests
        if: runner.environment == 'self-hosted'
        uses: actions/setup-node@v6
        with:
          node-version: "24.22.3"
          package-manager-cache: false

      - name: Run isolated readonly PostgreSQL acceptance
        shell: bash
        run: |
          set -euo pipefail
          samchat_ro_pg_bin=/usr/lib/postgresql/16/bin
          test -x "$samchat_ro_pg_bin/initdb"
          test -x "$samchat_ro_pg_bin/pg_ctl"
          mkdir -p reports/readonly_gateway
          samchat_ro_cluster=$(mktemp -d /tmp/samchat-ro-native-ci-XXXXXXXX)
          cleanup_readonly_cluster() {
            if [[ -f "$samchat_ro_cluster/data/postmaster.pid" ]]; then
              "$samchat_ro_pg_bin/pg_ctl" -D "$samchat_ro_cluster/data" -m fast -w stop
            fi
          }
          trap cleanup_readonly_cluster EXIT
          "$samchat_ro_pg_bin/initdb" -D "$samchat_ro_cluster/data" \
            -U postgres --encoding=UTF8 --locale=C \
            --auth-local=trust --auth-host=reject
          "$samchat_ro_pg_bin/pg_ctl" -D "$samchat_ro_cluster/data" \
            -l "$samchat_ro_cluster/server.log" \
            -o "-k $samchat_ro_cluster -c listen_addresses=''" -w start
          "$samchat_ro_pg_bin/createdb" -h "$samchat_ro_cluster" -U postgres devnous_db
          export SAMCHAT_TEST_SOCKET="$samchat_ro_cluster"
          export COVERAGE_FILE=reports/readonly_gateway/unit.coverage
          python -m coverage run --source=src/samchat/readonly_gateway \
            scripts/readonly_gateway/run_offline_tests.py --native-informes
          # Separate synthetic owner/contract suite; this does not replace native acceptance.
          npm install --prefix "$RUNNER_TEMP/samchat-read-candidate" \
            --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
          export SAMCHAT_TEST_PGLITE_PATH="$RUNNER_TEMP/samchat-read-candidate/node_modules/@electric-sql/pglite/dist/index.js"
          # A dotted --source imports app parents before the isolated runner and
          # can reload SQLAlchemy's Python modules around its C-extension state.
          # Native acceptance above already inventories all gateway source files.
          python -m coverage run --append \
            --include='src/samchat/readonly_gateway/*,src/devnous/gastos/services/connector_read_service.py' \
            scripts/readonly_gateway/run_expanded_tests.py
          python -m coverage report --fail-under=85
          # Original ORM/owners and native asyncpg, with a temporary passwordless
          # read role on the same disposable socket. No application binding.
          TEST_AMEX_NATIVE_SOCKET="$samchat_ro_cluster" PYTHON_DOTENV_DISABLED=1 \
            python -m coverage run \
              --data-file=reports/readonly_gateway/native-candidate.coverage \
              --include='src/samchat/readonly_gateway/*,src/devnous/gastos/services/connector_read_service.py,src/devnous/gastos/services/payment_run_service.py,src/devnous/gastos/routes/dependencies.py' \
              -m pytest tests/acceptance/test_connector_reads_native.py \
              --timeout=120 --no-cov -q

      - name: Combine unit coverage including isolated slices
        run: |
          mv .coverage .coverage.repository.unit
          python -m coverage combine .coverage.repository.unit reports/private-plugin/unit.coverage reports/readonly_gateway/unit.coverage reports/readonly_gateway/native-candidate.coverage

      - name: Summarize unit tests
        if: always()
        env:
          JUNIT_REPORTS: reports/unit-3.12.xml
        run: &junit-summary |
          python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          reports = [Path(name) for name in os.environ["JUNIT_REPORTS"].splitlines()]
          lines = ["| Report | Tests | Failures | Errors | Skipped |",
                   "| --- | ---: | ---: | ---: | ---: |"]
          missing = []
          for report in reports:
              if not report.is_file():
                  lines.append(f"| {report.name} | Missing | | | |")
                  missing.append(report.name)
                  continue
              suites = list(ElementTree.parse(report).getroot().iter("testsuite"))
              if not suites:
                  raise SystemExit(f"No test suite in {report.name}")
              counts = [str(sum(int(suite.get(key, 0)) for suite in suites))
                        for key in ("tests", "failures", "errors", "skipped")]
              lines.append("| " + " | ".join([report.name, *counts]) + " |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Test results\n\n" + "\n".join(lines) + "\n")
          if missing:
              raise SystemExit("Missing JUnit report: " + ", ".join(missing))
          PY

      - &export-coverage
        name: Pass coverage to the changed-code check
        id: export_coverage
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import os
          from pathlib import Path

          source = Path(".coverage")
          if not 0 < source.stat().st_size <= 16 * 1024 * 1024:
              raise SystemExit("Coverage database size is outside the supported range")
          data = source.read_bytes()
          if not data.startswith(b"SQLite format 3\0"):
              raise SystemExit("Expected a SQLite coverage database")
          payload = base64.b64encode(gzip.compress(data, mtime=0)).decode("ascii")
          # Leave room below Linux's 128 KiB limit for a single environment entry.
          if len(payload) > 120_000:
              raise SystemExit("Compressed coverage exceeds the job output limit")
          checksum = hashlib.sha256(data).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="ascii") as output:
              output.write(f"coverage_b64={payload}\ncoverage_sha256={checksum}\n")
          print(f"Prepared {len(payload)} characters of coverage with SHA-256 {checksum}")
          PY

  integration-tests:
    name: Integration tests (Python 3.12)
    runs-on: ${{ vars.SAMCHAT_CI_SELF_HOSTED == 'true' && 'samchat-ci' || 'ubuntu-24.04' }}
    outputs:
      coverage_b64: ${{ steps.export_coverage.outputs.coverage_b64 }}
      coverage_sha256: ${{ steps.export_coverage.outputs.coverage_sha256 }}
    services:
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: devnous_test
        options: >-
          --health-cmd "pg_isready -U test_user -d devnous_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          - 55471:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare the Python tool cache on the self-hosted runner
        if: runner.environment == 'self-hosted'
        run: sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /opt/hostedtoolcache

      - name: Set up Python
        uses: actions/setup-python@v5
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.environment == 'self-hosted' && '/opt/hostedtoolcache' || '' }}
        with:
          python-version: "3.12"

      - name: Free hosted runner disk space
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          rm -rf "$HOME/.cache/pip"
          mkdir -p "$HOME/.cache/pip"
          df -h /

      - name: Install dependencies
        env:
          PIP_NO_CACHE_DIR: "1"
        run: bash scripts/ci/install-cpu-test-dependencies.sh python -r requirements.txt

      - name: Install approved CTT test dependency and verify fixture bindings
        run: |
          python -m pip install fido2==2.2.1 "jsonschema>=4.0,<5"
          python scripts/ci/check-ctt-test-fixtures.py --prepare "/tmp/ctt-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --github-env "$GITHUB_ENV"

      - name: Verify Python from a synthetic CTT identity
        if: runner.environment == 'self-hosted'
        run: |
          sudo setpriv --reuid=310001 --regid=310001 --clear-groups \
            env -i PATH=/usr/bin:/bin "$(command -v python)" -c 'import pytest, coverage'

      - name: Run isolated private-plugin PostgreSQL integration tests
        run: |
          python -m venv .venv-private-plugin
          .venv-private-plugin/bin/python -m pip install -r requirements-private-plugin-postgres.txt coverage
          mkdir -p reports/private-plugin
          COVERAGE_FILE=reports/private-plugin/integration.coverage .venv-private-plugin/bin/python -m coverage run \
            --source=src/samchat/private_plugin scripts/private_plugin/run_postgres_tests.py

      - name: Run integration tests
        env:
          TEST_AMEX_DATABASE_URL: postgresql+asyncpg://test_user:test_password@127.0.0.1:55471/devnous_test
        run: |
          python -m pytest tests/integration \
            -k 'not operational_rpc' \
            --cov-config=.github/coverage-repository.ini \
            --ignore=tests/integration/private_plugin \
            --cov=src \
            --cov=copa_telmex_dashboard \
            --cov=deployment.ctt_protected_review \
            --cov=scripts \
            --cov-report= \
            --cov-fail-under=0 \
            --timeout=120 \
            --durations=20 \
            --junitxml=reports/integration-3.12.xml

      - name: Run mandatory CTT operational RPC with four separate numeric UIDs
        run: |
          sudo env \
            PYTHONPATH="$PYTHONPATH" \
            CTT_SCHEMA_ONLY_DIRECTORY="$CTT_SCHEMA_ONLY_DIRECTORY" \
            CTT_GATE_SOURCE="$CTT_GATE_SOURCE" \
            CTT_FIDO2_PATH="$CTT_FIDO2_PATH" \
            OPENAI_API_KEY=test-key ANTHROPIC_API_KEY=test-key \
            COVERAGE_FILE="$GITHUB_WORKSPACE/reports/ctt-operational.coverage" \
            "$(command -v python)" -m pytest \
              'tests/integration/test_ctt_review_workflow_postgres.py::test_private_prepare_to_official_committed_session[operational_rpc]' \
              'tests/integration/test_ctt_review_workflow_postgres.py::test_private_prepare_to_official_committed_session[operational_rpc_national]' \
              'tests/integration/test_ctt_review_workflow_postgres.py::test_private_prepare_to_official_committed_session[operational_rpc_national_optional_photo]' \
              --cov-config=.github/coverage-repository.ini \
              --cov=src --cov=copa_telmex_dashboard \
              --cov=deployment.ctt_protected_review \
              --cov=scripts \
              --cov-report= --cov-fail-under=0 --timeout=120 \
              --junitxml=reports/ctt-operational.xml

      - name: Require complete CTT PostgreSQL acceptance without skipped cohorts
        run: python scripts/ci/check-ctt-test-fixtures.py --check-junit reports/integration-3.12.xml --additional-junit reports/ctt-operational.xml

      - name: Combine integration coverage including isolated plugin tests
        run: |
          mv .coverage .coverage.repository.integration
          python -m coverage combine .coverage.repository.integration reports/private-plugin/integration.coverage reports/ctt-operational.coverage

      - name: Summarize integration tests
        if: always()
        env:
          JUNIT_REPORTS: |
            reports/integration-3.12.xml
            reports/ctt-operational.xml
        run: *junit-summary

      - *export-coverage

  changed-code-coverage:
    name: Changed-code coverage (85%)
    if: github.event_name == 'pull_request'
    needs: [unit-tests, integration-tests]
    runs-on: ${{ vars.SAMCHAT_CI_SELF_HOSTED == 'true' && 'samchat-ci' || 'ubuntu-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage tools
        run: python -m pip install coverage diff-cover

      - name: Restore and verify coverage from both jobs
        env:
          UNIT_COVERAGE_B64: ${{ needs.unit-tests.outputs.coverage_b64 }}
          UNIT_COVERAGE_SHA256: ${{ needs.unit-tests.outputs.coverage_sha256 }}
          INTEGRATION_COVERAGE_B64: ${{ needs.integration-tests.outputs.coverage_b64 }}
          INTEGRATION_COVERAGE_SHA256: ${{ needs.integration-tests.outputs.coverage_sha256 }}
        run: |
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import io
          import os
          from pathlib import Path

          directory = Path(os.environ["RUNNER_TEMP"]) / "samchat-coverage"
          directory.mkdir()
          maximum_bytes = 16 * 1024 * 1024
          for job in ("unit", "integration"):
              prefix = job.upper() + "_COVERAGE_"
              payload = os.environ[prefix + "B64"]
              checksum = os.environ[prefix + "SHA256"]
              if not payload or len(payload) > 120_000 or not checksum:
                  raise SystemExit(f"Missing or oversized coverage output from {job}")
              compressed = base64.b64decode(payload, validate=True)
              with gzip.GzipFile(fileobj=io.BytesIO(compressed)) as archive:
                  data = archive.read(maximum_bytes + 1)
              if len(data) > maximum_bytes or not data.startswith(b"SQLite format 3\0"):
                  raise SystemExit(f"Invalid coverage database from {job}")
              if hashlib.sha256(data).hexdigest() != checksum:
                  raise SystemExit(f"Coverage checksum mismatch for {job}")
              (directory / f".coverage.{job}").write_bytes(data)
              print(f"Verified {job} coverage SHA-256 {checksum}")
          PY

      - name: Combine coverage data
        run: |
          coverage combine "$RUNNER_TEMP/samchat-coverage"
          coverage xml -o coverage.xml

      - name: Enforce coverage on changed lines
        shell: bash
        run: |
          diff-cover coverage.xml \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=85 | tee "$RUNNER_TEMP/samchat-changed-coverage.txt"

      - name: Summarize changed-code coverage
        if: always()
        run: |
          {
            echo '## Changed-code coverage (85% required)'
            echo
            if [[ -f "$RUNNER_TEMP/samchat-changed-coverage.txt" ]]; then
              printf '```text\n'
              cat "$RUNNER_TEMP/samchat-changed-coverage.txt"
              printf '```\n'
            else
              echo 'No coverage report was produced. See the job log.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  security-scan:
    name: Python security baseline
    runs-on: ${{ vars.SAMCHAT_CI_SELF_HOSTED == 'true' && 'samchat-ci' || 'ubuntu-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install security tools
        run: python -m pip install bandit pip-audit

      - name: Audit dependencies against explicit baseline
        run: |
          pip-audit --requirement requirements.txt \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815

      - name: Scan Python for new high-confidence findings
        run: |
          mkdir -p reports
          set +e
          bandit -r src copa_telmex_dashboard.py \
            --severity-level high \
            --confidence-level high \
            --format json \
            --output reports/bandit-high-confidence.json
          bandit_status=$?
          set -e
          if [[ "$bandit_status" -ne 0 && "$bandit_status" -ne 1 ]]; then
            echo "Bandit did not complete normally (exit $bandit_status)."
            exit "$bandit_status"
          fi
          python scripts/ci/check-bandit-baseline.py \
            --report reports/bandit-high-confidence.json \
            --baseline .github/bandit-high-confidence-baseline.txt

  required-pr-gate:
    name: Required PR gate
    if: always()
    needs: [policy, unit-tests, integration-tests, changed-code-coverage, security-scan]
    runs-on: ${{ vars.SAMCHAT_CI_SELF_HOSTED == 'true' && 'samchat-ci' || 'ubuntu-latest' }}
    steps:
      - name: Require every mandatory job
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          INTEGRATION_RESULT: ${{ needs.integration-tests.result }}
          COVERAGE_RESULT: ${{ needs.changed-code-coverage.result }}
          SECURITY_RESULT: ${{ needs.security-scan.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os

          required = {
              "policy": os.environ["POLICY_RESULT"],
              "unit": os.environ["UNIT_RESULT"],
              "integration": os.environ["INTEGRATION_RESULT"],
              "security": os.environ["SECURITY_RESULT"],
          }
          if os.environ["EVENT_NAME"] == "pull_request":
              required["coverage"] = os.environ["COVERAGE_RESULT"]

          failed = {name: result for name, result in required.items() if result != "success"}
          if failed:
              raise SystemExit(f"Mandatory PR gate failed: {failed}")
          print(f"Mandatory PR gate passed: {required}")
          PY

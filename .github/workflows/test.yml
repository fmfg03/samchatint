name: Test Suite

on:
  pull_request:
    branches: [master, main, develop]
  push:
    branches: [master, main, develop]
  merge_group:

concurrency:
  group: test-suite-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONPATH: src
  OPENAI_API_KEY: test-key
  ANTHROPIC_API_KEY: test-key
  REDIS_URL: redis://localhost:6379/1
  POSTGRESQL_URL: postgresql://test_user:test_password@localhost:5432/devnous_test

jobs:
  policy:
    name: Policy and repository contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install gate dependencies
        run: python -m pip install PyYAML setuptools

      - name: Check workflow contract
        run: python scripts/ci/check-pr-quality-gate.py

      - name: Check runtime, registration, and accepted regressions
        run: |
          python scripts/check_runtime_packaging_consistency.py
          python scripts/ci/check-registration-operational-surface.py
          python scripts/ci/check-accepted-regressions.py

      - name: Compile production and test Python
        run: |
          python -m compileall -q \
            -x '(^|/)(\.venv|venv|node_modules|tmp|artifacts|cleanup-backups)(/|$)' \
            copa_telmex_dashboard.py src tests

      - name: Check diff hygiene
        run: git diff --check

  unit-tests:
    name: Unit tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: |
          set +e
          python -m pytest tests/unit \
            --cov=src \
            --cov=copa_telmex_dashboard \
            --cov-report= \
            --cov-fail-under=0 \
            --timeout=60 \
            --durations=20 \
            --junitxml=reports/unit-3.12.xml
          pytest_status=$?
          set -e
          python scripts/ci/check-pytest-baseline.py \
            --junit reports/unit-3.12.xml \
            --baseline .github/pytest-unit-failures.txt
          if [[ "$pytest_status" -ne 0 ]]; then
            echo "Pytest exited $pytest_status; all failures matched the explicit baseline."
          fi

      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-python-3.12
          path: reports/unit-3.12.xml
          if-no-files-found: error

      - name: Upload unit coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-unit
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error

  integration-tests:
    name: Integration tests (Python 3.12)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: devnous_test
        options: >-
          --health-cmd "pg_isready -U test_user -d devnous_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run integration tests
        run: |
          python -m pytest tests/integration \
            --cov=src \
            --cov=copa_telmex_dashboard \
            --cov-report= \
            --cov-fail-under=0 \
            --timeout=120 \
            --durations=20 \
            --junitxml=reports/integration-3.12.xml

      - name: Upload integration-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-tests-python-3.12
          path: reports/integration-3.12.xml
          if-no-files-found: error

      - name: Upload integration coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-integration
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error

  changed-code-coverage:
    name: Changed-code coverage (85%)
    if: github.event_name == 'pull_request'
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage tools
        run: python -m pip install coverage diff-cover

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          path: coverage-data

      - name: Combine coverage data
        run: |
          mv coverage-data/coverage-data-unit/.coverage coverage-data/.coverage.unit
          mv coverage-data/coverage-data-integration/.coverage coverage-data/.coverage.integration
          coverage combine coverage-data
          coverage xml -o coverage.xml

      - name: Enforce coverage on changed lines
        run: |
          diff-cover coverage.xml \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=85

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: changed-code-coverage
          path: coverage.xml
          if-no-files-found: error

  security-scan:
    name: Python security baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install security tools
        run: python -m pip install bandit pip-audit

      - name: Audit dependencies against explicit baseline
        run: |
          pip-audit --requirement requirements.txt \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815

      - name: Scan Python for new high-confidence findings
        run: |
          bandit -r src copa_telmex_dashboard.py \
            --severity-level high \
            --confidence-level high \
            --skip B324

  required-pr-gate:
    name: Required PR gate
    if: always()
    needs: [policy, unit-tests, integration-tests, changed-code-coverage, security-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Require every mandatory job
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          INTEGRATION_RESULT: ${{ needs.integration-tests.result }}
          COVERAGE_RESULT: ${{ needs.changed-code-coverage.result }}
          SECURITY_RESULT: ${{ needs.security-scan.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os

          required = {
              "policy": os.environ["POLICY_RESULT"],
              "unit": os.environ["UNIT_RESULT"],
              "integration": os.environ["INTEGRATION_RESULT"],
              "security": os.environ["SECURITY_RESULT"],
          }
          if os.environ["EVENT_NAME"] == "pull_request":
              required["coverage"] = os.environ["COVERAGE_RESULT"]

          failed = {name: result for name, result in required.items() if result != "success"}
          if failed:
              raise SystemExit(f"Mandatory PR gate failed: {failed}")
          print(f"Mandatory PR gate passed: {required}")
          PY

name: Temporary Direction Focus Contrast Fix

on:
  push:
    branches: ["fix/direction-ui-contrast-aa"]

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/direction-ui-contrast-aa
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply focus contrast fix and regression
        run: |
          python - <<'PY'
          from pathlib import Path

          ui_path = Path("src/samchat/client_executive/ui.py")
          ui = ui_path.read_text()
          old = "a:focus-visible,button:focus-visible,select:focus-visible,summary:focus-visible {{ outline:3px solid #38bdf8; outline-offset:2px; }}"
          new = "a:focus-visible,button:focus-visible,select:focus-visible,summary:focus-visible {{ outline:3px solid var(--link); outline-offset:2px; }}"
          if old in ui:
              ui = ui.replace(old, new, 1)
          elif new not in ui:
              raise SystemExit("focus-visible rule not found")
          ui_path.write_text(ui)

          test_path = Path("tests/unit/test_client_executive_auth.py")
          tests = test_path.read_text()
          tests = tests.replace(
              '    assert "outline:3px solid #38bdf8" in html\n',
              '    assert "outline:3px solid var(--link)" in html\n',
          )
          marker = '    assert contrast("#67e8f9", "#101c2a") >= 4.5\n'
          addition = (
              '    assert contrast("#0369a1", "#ffffff") >= 3\n'
              '    assert contrast("#0369a1", "#f5f7fa") >= 3\n'
              '    assert contrast("#7dd3fc", "#07111c") >= 3\n'
              '    assert contrast("#7dd3fc", "#101c2a") >= 3\n'
          )
          if addition not in tests:
              if marker not in tests:
                  raise SystemExit("contrast regression marker not found")
              tests = tests.replace(marker, marker + addition, 1)
          test_path.write_text(tests)
          PY

      - name: Format and validate
        run: |
          python -m pip install "black==26.5.1" "isort==9.0.1" pytest pytest-asyncio pytest-cov
          python -m isort src/samchat/client_executive/ui.py tests/unit/test_client_executive_auth.py
          python -m black src/samchat/client_executive/ui.py tests/unit/test_client_executive_auth.py
          python -m isort --check-only src/samchat/client_executive/ui.py tests/unit/test_client_executive_auth.py
          python -m black --check src/samchat/client_executive/ui.py tests/unit/test_client_executive_auth.py
          python -m py_compile src/samchat/client_executive/ui.py tests/unit/test_client_executive_auth.py

      - name: Run focused regression
        run: |
          python -m pip install -e .
          python -m pytest -q tests/unit/test_client_executive_auth.py -k 'contrast or dashboard_renders_requested_executive_sections'

      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/samchat/client_executive/ui.py tests/unit/test_client_executive_auth.py
          git commit -m "fix(direction): use theme-aware focus contrast"
          git push origin HEAD:fix/direction-ui-contrast-aa

name: Browser UX Pilot

on:
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: src
  OPENAI_API_KEY: test-key
  ANTHROPIC_API_KEY: test-key

jobs:
  browser-smoke:
    name: Browser UX smoke
    runs-on: ${{ vars.SAMCHAT_CI_SELF_HOSTED == 'true' && 'samchat-ci' || 'ubuntu-24.04' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Free hosted runner disk space
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          rm -rf "$HOME/.cache/pip"
          mkdir -p "$HOME/.cache/pip"
          df -h /

      - name: Install browser test dependencies
        env:
          PIP_NO_CACHE_DIR: "1"
        run: bash scripts/ci/install-cpu-test-dependencies.sh python -r requirements-browser.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run browser UX smoke
        env:
          SAMCHAT_BROWSER_ARTIFACT_DIR: artifacts/browser
        run: |
          mkdir -p reports artifacts/browser
          python -m pytest -q tests/browser \
            --timeout=90 \
            --junitxml=reports/browser.xml

      - name: Summarize browser tests
        if: always()
        env:
          JUNIT_REPORTS: reports/browser.xml
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          reports = [Path(name) for name in os.environ["JUNIT_REPORTS"].splitlines()]
          lines = ["| Report | Tests | Failures | Errors | Skipped |",
                   "| --- | ---: | ---: | ---: | ---: |"]
          missing = []
          for report in reports:
              if not report.is_file():
                  lines.append(f"| {report.name} | Missing | | | |")
                  missing.append(report.name)
                  continue
              suites = list(ElementTree.parse(report).getroot().iter("testsuite"))
              if not suites:
                  raise SystemExit(f"No test suite in {report.name}")
              counts = [str(sum(int(suite.get(key, 0)) for suite in suites))
                        for key in ("tests", "failures", "errors", "skipped")]
              lines.append("| " + " | ".join([report.name, *counts]) + " |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Test results\n\n" + "\n".join(lines) + "\n")
          if missing:
              raise SystemExit("Missing JUnit report: " + ", ".join(missing))
          PY

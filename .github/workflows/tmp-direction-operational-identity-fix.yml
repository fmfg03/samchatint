name: Temporary Direction Truth Blocker Remediation

on:
  push:
    branches: ["fix/direction-dashboard-truth-ui-v2"]

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/direction-dashboard-truth-ui-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preserve optional-source truth and payment semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          service_path = Path("src/samchat/client_executive/service.py")
          service = service_path.read_text()
          old_dossier = '''    dossier = build_director_general_entity_dossier(snapshot)\n    soul = snapshot.get("soul") if isinstance(snapshot.get("soul"), dict) else {}\n    dossier["source_status"] = "available"\n    dossier["source_bridge"] = bridge\n    dossier["national_phase"] = dict((soul or {}).get("national_phase") or {})\n    dossier["marketing"] = dict((soul or {}).get("marketing") or {})\n    return dossier\n'''
          new_dossier = '''    dossier = build_director_general_entity_dossier(snapshot)\n    soul = snapshot.get("soul") if isinstance(snapshot.get("soul"), dict) else {}\n    optional_sources = snapshot.get("optional_sources")\n    optional_sources = (\n        optional_sources if isinstance(optional_sources, dict) else {}\n    )\n\n    def optional_source_unavailable(name: str) -> bool:\n        state = optional_sources.get(name)\n        return isinstance(state, dict) and state.get("available") is False\n\n    national_phase = dict((soul or {}).get("national_phase") or {})\n    if optional_source_unavailable("matches"):\n        national_phase["matches_source_status"] = "unavailable"\n    if optional_source_unavailable("team_standings"):\n        national_phase["standings_source_status"] = "unavailable"\n\n    marketing = dict((soul or {}).get("marketing") or {})\n    media = dict(marketing.get("media") or {})\n    if optional_source_unavailable("gallery_photos"):\n        media["photos_source_status"] = "unavailable"\n    if optional_source_unavailable("featured_videos"):\n        media["videos_source_status"] = "unavailable"\n    if optional_source_unavailable("live_streams"):\n        media["streams_source_status"] = "unavailable"\n    marketing["media"] = media\n\n    dossier["source_status"] = "available"\n    dossier["source_bridge"] = bridge\n    dossier["national_phase"] = national_phase\n    dossier["marketing"] = marketing\n    return dossier\n'''
          if old_dossier in service:
              service = service.replace(old_dossier, new_dossier, 1)
          elif new_dossier not in service:
              raise SystemExit("operational dossier projection block not found")
          service_path.write_text(service)

          ui_path = Path("src/samchat/client_executive/ui.py")
          ui = ui_path.read_text()
          old_paid_note = '''    paid_note = (\n        "Total pagado al corte" if paid is not None else "Sin total pagado acreditado"\n    )\n'''
          new_paid_note = '''    paid_note = (\n        "Estado documental pagado/cerrado o fecha de pago registrada; "\n        "no equivale por sí solo a salida de caja"\n        if paid is not None\n        else "Sin total pagado acreditado"\n    )\n'''
          if old_paid_note in ui:
              ui = ui.replace(old_paid_note, new_paid_note, 1)
          elif new_paid_note not in ui:
              raise SystemExit("paid KPI note block not found")

          old_paid_kpi = "        {_kpi('Pagado', paid, note=paid_note)}"
          new_paid_kpi = "        {_kpi('Cerrado / pagado', paid, note=paid_note)}"
          if old_paid_kpi in ui:
              ui = ui.replace(old_paid_kpi, new_paid_kpi, 1)
          elif new_paid_kpi not in ui:
              raise SystemExit("paid KPI label block not found")

          national_marker = '''    matches = list(national.get("matches") or [])\n'''
          national_guard = '''    if national.get("matches_source_status") == "unavailable":\n        return f"""\n        <section id="fase-nacional-{index}" class="panel compact-panel">\n          <div class="section-heading"><div><span class="eyebrow">Fase nacional</span><h2>Operación y finanzas de finales</h2></div>{_status('unavailable')}</div>\n          <p class="empty-copy">La fuente de partidos no está disponible; no se presenta una lista vacía como si acreditara ausencia de partidos.</p>\n        </section>\n        """\n    matches = list(national.get("matches") or [])\n'''
          if national_guard not in ui:
              if national_marker not in ui:
                  raise SystemExit("national phase matches marker not found")
              ui = ui.replace(national_marker, national_guard, 1)

          marketing_start = ui.index("def _marketing(")
          marketing_end = ui.index("\n\ndef ", marketing_start)
          new_marketing = '''def _marketing(dossier: dict[str, Any], index: int) -> str:\n    marketing = dict(dossier.get("marketing") or {})\n    media = dict(marketing.get("media") or {})\n    source_unavailable = (\n        marketing.get("status") == "unavailable"\n        or (dossier.get("source_status") or "unavailable") != "available"\n    )\n    photos_unavailable = (\n        source_unavailable or media.get("photos_source_status") == "unavailable"\n    )\n    videos_unavailable = (\n        source_unavailable or media.get("videos_source_status") == "unavailable"\n    )\n    streams_unavailable = (\n        source_unavailable or media.get("streams_source_status") == "unavailable"\n    )\n    component_unavailable = (\n        photos_unavailable or videos_unavailable or streams_unavailable\n    )\n    evidence_count = sum(\n        int(media.get(key) or 0)\n        for key, unavailable in (\n            ("photos_count", photos_unavailable),\n            ("videos_count", videos_unavailable),\n            ("streams_count", streams_unavailable),\n        )\n        if not unavailable\n    )\n    if source_unavailable:\n        evidence_status = "unavailable"\n    elif component_unavailable:\n        evidence_status = "partial"\n    else:\n        evidence_status = "with_data" if evidence_count else "pending_data"\n    photos = (\n        "Fuente no disponible"\n        if photos_unavailable\n        else str(int(media.get("photos_count") or 0))\n    )\n    videos = (\n        "Fuente no disponible"\n        if videos_unavailable\n        else str(int(media.get("videos_count") or 0))\n    )\n    return f"""\n    <section id="mercadotecnia-{index}" class="panel {'compact-panel' if source_unavailable else ''}">\n      <div class="section-heading"><div><span class="eyebrow">Mercadotecnia</span><h2>Activaciones y evidencia</h2></div>{_status(evidence_status)}</div>\n      <div class="mini-kpis marketing-kpis">\n        <div><span>Proveedores presentes</span><strong>—</strong></div>\n        <div><span>Visitantes patrocinadores</span><strong>—</strong></div>\n        <div><h4>Fotografías</h4><p>{photos}</p></div>\n        <div><h4>Videos</h4><p>{videos}</p></div>\n      </div>\n      {'<p class="section-note">La existencia de fotografías no prueba por sí sola una activación ni su resultado.</p>' if not source_unavailable else ''}\n    </section>\n    """\n'''
          ui = ui[:marketing_start] + new_marketing + ui[marketing_end:]
          ui_path.write_text(ui)

          test_path = Path("tests/unit/test_direction_dashboard_source_reconciliation.py")
          tests = test_path.read_text()
          if "test_optional_soul_source_failures_remain_component_unavailable" not in tests:
              tests += '''\n\n\n@pytest.mark.asyncio\nasync def test_optional_soul_source_failures_remain_component_unavailable(monkeypatch):\n    async def load_snapshot(_tournament, *, edition_year):\n        assert edition_year == 2026\n        return (\n            {\n                "soul": {\n                    "national_phase": {"status": "pending_data", "matches": []},\n                    "marketing": {\n                        "status": "pending_data",\n                        "media": {\n                            "photos_count": 0,\n                            "videos_count": 0,\n                            "streams_count": 0,\n                        },\n                    },\n                },\n                "optional_sources": {\n                    "matches": {"available": False, "rows": 0, "error": "hidden"},\n                    "gallery_photos": {\n                        "available": False,\n                        "rows": 0,\n                        "error": "hidden",\n                    },\n                    "featured_videos": {"available": True, "rows": 0, "error": None},\n                    "live_streams": {"available": False, "rows": 0, "error": "hidden"},\n                },\n            },\n            "authorized_uuid",\n        )\n\n    monkeypatch.setattr(service, "_load_soul_snapshot", load_snapshot)\n    monkeypatch.setattr(\n        service,\n        "build_director_general_entity_dossier",\n        lambda _snapshot: {"entities": []},\n    )\n\n    dossier = await service._build_operational_dossier(\n        {"id": "local-id", "name": "Copa Telmex", "slug": ""},\n        edition_year=2026,\n    )\n\n    assert dossier["source_status"] == "available"\n    assert dossier["national_phase"]["matches_source_status"] == "unavailable"\n    assert dossier["marketing"]["media"]["photos_source_status"] == "unavailable"\n    assert dossier["marketing"]["media"]["streams_source_status"] == "unavailable"\n    assert "Fuente de partidos no está disponible" in ui._national_phase(dossier, 0)\n    marketing_html = ui._marketing(dossier, 0)\n    assert '<span class="status status-partial">Parcial</span>' in marketing_html\n    assert "<h4>Fotografías</h4><p>Fuente no disponible</p>" in marketing_html\n    assert "<h4>Videos</h4><p>0</p>" in marketing_html\n\n\ndef test_paid_kpi_reflects_broader_document_semantics_without_claiming_cash_exit():\n    rendered = ui._budget_kpis(\n        {\n            "budget": 1000.0,\n            "actual": 420.0,\n            "committed": 650.0,\n            "paid": 375.0,\n            "projected": 900.0,\n            "available": 350.0,\n            "budget_source_status": "available",\n        }\n    )\n\n    assert "<span>Cerrado / pagado</span><strong>$375.00</strong>" in rendered\n    assert "no equivale por sí solo a salida de caja" in rendered\n    assert "Total pagado al corte" not in rendered\n'''
          test_path.write_text(tests)
          PY

      - name: Format and validate changed Python
        run: |
          python -m pip install "black==26.5.1" "isort==9.0.1" pytest pytest-asyncio pytest-cov
          python -m isort \
            src/samchat/client_executive/service.py \
            src/samchat/client_executive/ui.py \
            tests/unit/test_direction_dashboard_source_reconciliation.py
          python -m black \
            src/samchat/client_executive/service.py \
            src/samchat/client_executive/ui.py \
            tests/unit/test_direction_dashboard_source_reconciliation.py
          python -m isort --check-only \
            src/samchat/client_executive/service.py \
            src/samchat/client_executive/ui.py \
            tests/unit/test_direction_dashboard_source_reconciliation.py
          python -m black --check \
            src/samchat/client_executive/service.py \
            src/samchat/client_executive/ui.py \
            tests/unit/test_direction_dashboard_source_reconciliation.py

      - name: Run focused Direction regressions
        run: |
          python -m pip install -e .
          python -m pytest -q \
            tests/unit/test_direction_dashboard_source_reconciliation.py \
            tests/unit/test_direction_dashboard_scope_identity.py \
            tests/unit/test_direction_dashboard_account_truth.py \
            tests/unit/test_client_executive_service.py

      - name: Commit remediation
        run: |
          if git diff --quiet; then
            echo "No remediation changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/samchat/client_executive/service.py \
            src/samchat/client_executive/ui.py \
            tests/unit/test_direction_dashboard_source_reconciliation.py
          git commit -m "fix(direction): preserve component source truth"
          git push origin HEAD:fix/direction-dashboard-truth-ui-v2

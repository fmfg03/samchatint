name: Temporary Direction Operational Identity Fix

on:
  push:
    branches: ["fix/direction-dashboard-truth-ui-v2"]

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/direction-dashboard-truth-ui-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Harden operational identity comparison
        run: |
          python - <<'PY'
          from pathlib import Path

          service_path = Path("src/samchat/client_executive/service.py")
          service = service_path.read_text()
          old = '''    if _identity_text(item.get("name")) != _identity_text(tournament.get("name")):\n        return False\n'''
          new = '''    source_name = str(item.get("name") or "").strip().casefold()\n    authorized_name = str(tournament.get("name") or "").strip().casefold()\n    if source_name != authorized_name:\n        return False\n'''
          if old in service:
              service = service.replace(old, new, 1)
          elif new not in service:
              raise SystemExit("operational exact-name comparison block not found")
          service_path.write_text(service)

          test_path = Path("tests/unit/test_direction_dashboard_source_reconciliation.py")
          tests = test_path.read_text()
          tests = tests.replace(
              '"name": "Copa Telmex Telcel de Futbol",\n                    "start_date": "2026-01-15",',
              '"name": "Copa Telmex Telcel de Fútbol",\n                    "start_date": "2026-01-15",',
              1,
          )
          if "test_operational_name_bridge_rejects_accent_or_internal_whitespace_variants" not in tests:
              tests += '''\n\n\n@pytest.mark.asyncio\n@pytest.mark.parametrize(\n    "source_name",\n    [\n        "Copa Telmex Telcel de Futbol",\n        "Copa  Telmex Telcel de Fútbol",\n    ],\n)\nasync def test_operational_name_bridge_rejects_accent_or_internal_whitespace_variants(\n    monkeypatch, source_name: str\n):\n    async def snapshot(*, tournament_slug, **_kwargs):\n        if tournament_slug == "local-id":\n            raise TournamentsV2Error("different UUID namespace")\n        return {\n            "tournaments": [\n                {\n                    "id": "supabase-id",\n                    "name": source_name,\n                    "start_date": "2026-01-15",\n                }\n            ],\n            "soul": {"tournament": {"id": "supabase-id"}},\n        }\n\n    monkeypatch.setattr(service, "build_tournament_soul_snapshot", snapshot)\n\n    dossier = await service._build_operational_dossier(\n        {\n            "id": "local-id",\n            "name": "Copa Telmex Telcel de Fútbol",\n            "slug": "",\n        },\n        edition_year=2026,\n    )\n\n    assert dossier["source_status"] == "unavailable"\n    assert dossier["entities"] == []\n'''
          test_path.write_text(tests)
          PY

      - name: Format and validate
        run: |
          python -m pip install "black==26.5.1" "isort==9.0.1" pytest pytest-asyncio pytest-cov
          python -m isort \
            src/samchat/client_executive/service.py \
            tests/unit/test_direction_dashboard_source_reconciliation.py
          python -m black \
            src/samchat/client_executive/service.py \
            tests/unit/test_direction_dashboard_source_reconciliation.py
          python -m isort --check-only \
            src/samchat/client_executive/service.py \
            tests/unit/test_direction_dashboard_source_reconciliation.py
          python -m black --check \
            src/samchat/client_executive/service.py \
            tests/unit/test_direction_dashboard_source_reconciliation.py

      - name: Install project and run focused Direction regressions
        run: |
          python -m pip install -e .
          python -m pytest -q \
            tests/unit/test_direction_dashboard_source_reconciliation.py \
            tests/unit/test_direction_dashboard_scope_identity.py \
            tests/unit/test_direction_dashboard_account_truth.py \
            tests/unit/test_client_executive_service.py

      - name: Commit remediation
        run: |
          if git diff --quiet; then
            echo "No remediation changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/samchat/client_executive/service.py \
            tests/unit/test_direction_dashboard_source_reconciliation.py
          git commit -m "fix(direction): require exact operational bridge identity"
          git push origin HEAD:fix/direction-dashboard-truth-ui-v2

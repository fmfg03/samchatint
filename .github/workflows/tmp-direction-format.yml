name: Temporary Direction Formatter

on:
  push:
    branches: ["fix/direction-dashboard-truth-ui-v2"]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/direction-dashboard-truth-ui-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install required formatters
        run: python -m pip install "black==26.5.1" "isort==9.0.1"

      - name: Format changed Python files
        run: |
          python -m isort \
            src/samchat/client_executive/service.py \
            src/samchat/client_executive/ui.py \
            tests/unit/test_direction_dashboard_account_truth.py \
            tests/unit/test_direction_dashboard_scope_identity.py \
            tests/unit/test_direction_dashboard_source_reconciliation.py
          python -m black \
            src/samchat/client_executive/service.py \
            src/samchat/client_executive/ui.py \
            tests/unit/test_direction_dashboard_account_truth.py \
            tests/unit/test_direction_dashboard_scope_identity.py \
            tests/unit/test_direction_dashboard_source_reconciliation.py
          python -m isort --check-only \
            src/samchat/client_executive/service.py \
            src/samchat/client_executive/ui.py \
            tests/unit/test_direction_dashboard_account_truth.py \
            tests/unit/test_direction_dashboard_scope_identity.py \
            tests/unit/test_direction_dashboard_source_reconciliation.py
          python -m black --check \
            src/samchat/client_executive/service.py \
            src/samchat/client_executive/ui.py \
            tests/unit/test_direction_dashboard_account_truth.py \
            tests/unit/test_direction_dashboard_scope_identity.py \
            tests/unit/test_direction_dashboard_source_reconciliation.py

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/samchat/client_executive/service.py \
            src/samchat/client_executive/ui.py \
            tests/unit/test_direction_dashboard_account_truth.py \
            tests/unit/test_direction_dashboard_scope_identity.py \
            tests/unit/test_direction_dashboard_source_reconciliation.py
          git commit -m "style(direction): apply black and isort"
          git push origin HEAD:fix/direction-dashboard-truth-ui-v2
